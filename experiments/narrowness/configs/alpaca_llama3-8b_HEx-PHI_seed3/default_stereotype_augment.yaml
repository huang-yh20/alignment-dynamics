model:
  name: ${ALIGN_LLAMA3_1_8B_ALPACA}
  device: auto
  seed: 42
  max_length: 512
data:
  processed_dir: data/processed/narrowness/Alpaca_HEx-PHI_Stereotype_Augment
  seed: 3
  train_positive_data: train/safe_300.json
  train_negative_data: train/unsafe_10k.json
  test_positive_data: test/safe_300.json
  test_negative_data: test/safe_300.json
training:
  per_device_train_batch_size: 2
  learning_rate: 1e-6
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
saving:
  stage_1_save_steps:
  - 300
  - 600
  - 900
  stage_2_save_steps:
  - 1
  - 16
  - 32
  - 64
  - 128
  - 256
  - 512
  - 1024
  reverse_start_step: 900
  stage_3_search_step_size: 1
  stage_3_max_search_steps: 128
evaluation:
  eval_every: 9999
  sentiment_model: cardiffnlp/twitter-roberta-base-sentiment-latest
  safety_model: google/shieldgemma-9b
  compute:
  - safety_score
  - positive_token_log_prob
  - negative_token_log_prob
  - compress_rate_diff
  recovery_metric: safety_score
  recovery_threshold: 0.005
deepspeed: configs/runtime/deepspeed_config_zero2.json
