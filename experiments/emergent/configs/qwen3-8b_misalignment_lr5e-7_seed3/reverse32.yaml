model:
  name: ${ALIGN_QWEN3_8B_ALPACA}
  device: auto
  seed: 42
  max_length: 512
data:
  processed_dir: data/processed/emergent/emergent-advice
  seed: 3
  train_positive_data: train/unsafe_10k.json
  train_negative_data: train/safe_10k.json
  test_positive_data: test/unsafe_1k.json
  test_negative_data: test/unsafe_44_eval.json
training:
  per_device_train_batch_size: 2
  learning_rate: 5e-7
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
deepspeed: configs/runtime/deepspeed_config_zero2.json
saving:
  stage_1_save_steps:
  - 16
  - 32
  - 64
  - 128
  - 256
  - 512
  - 1024
  stage_2_save_steps:
  - 1
  - 16
  - 32
  - 64
  - 128
  - 256
  - 512
  - 1024
  reverse_start_step: 32
  stage_3_search_step_size: 1
  stage_3_max_search_steps: 128
evaluation:
  eval_every: 9999
  sentiment_model: cardiffnlp/twitter-roberta-base-sentiment-latest
  safety_model: google/shieldgemma-9b
  misalignment_score_model: google/shieldgemma-9b
  compute:
  - misalignment_score
  - positive_token_log_prob
  recovery_metric: obvious_misalignment_rate
  recovery_threshold: 0.03
